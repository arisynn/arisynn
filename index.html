<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon Connect Pro Multiplayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #fce7f3; touch-action: none;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            font-family: 'Quicksand', sans-serif;
        }

        .cute-button {
            background-color: white; color: #ec4899;
            border: 2px solid #fbcfe8; border-radius: 50%;
            transition: all 0.1s ease; outline: none;
        }
        .cute-button:active { transform: scale(0.9); background-color: #fdf2f8; }
        
        .cute-btn-text {
            background: linear-gradient(to right, #f472b6, #c084fc);
            color: white; border-radius: 9999px;
            box-shadow: 0 4px 0 #d8b4fe, 0 6px 10px rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .cute-btn-text:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #d8b4fe, 0 2px 4px rgba(0,0,0,0.15);
        }

        .cute-tile {
            background-color: white; border: 1px solid #fbcfe8;
            border-radius: 5px; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s ease-out, border-color 0.15s ease-out;
            position: relative;
        }
        
        .cute-tile.selected {
            background-color: #fff1f2; border: 2px solid #ec4899;
            transform: scale(1.12); box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4); z-index: 30;
        }

        .cute-tile.matched {
            transition: transform 0.2s ease-out, opacity 0.15s ease-out 0.2s; 
            opacity: 0; transform: scale(1.2) translateY(-12px);
            pointer-events: none; z-index: 40;
            box-shadow: 0 0 15px rgba(251, 191, 36, 0.8); border-color: #fbbf24;
        }

        @keyframes drawAndFadeJelly {
            0%   { stroke-dashoffset: 100; opacity: 1; }
            40%  { stroke-dashoffset: 0;   opacity: 1; } 
            60%  { stroke-dashoffset: 0;   opacity: 1; } 
            100% { stroke-dashoffset: 0;   opacity: 0; } 
        }
        .path-line-outer, .path-line-inner {
            stroke-dasharray: 100;
            animation: drawAndFadeJelly 0.35s ease-out forwards; 
        }

        @keyframes pulseHint {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); border-color: #fbbf24;}
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }
        .hint-glow { animation: pulseHint 1s infinite; z-index: 25; }

        @keyframes countdownPop {
            0%   { transform: scale(1.6); opacity: 0; }
            30%  { transform: scale(0.9); opacity: 1; }
            60%  { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes wrongShake {
            0%   { transform: translateX(0); border-color: #ef4444; }
            20%  { transform: translateX(-4px); }
            40%  { transform: translateX(4px); }
            60%  { transform: translateX(-3px); }
            80%  { transform: translateX(3px); }
            100% { transform: translateX(0); border-color: #fbcfe8; }
        }
        .cute-tile.wrong { animation: wrongShake 0.35s ease-out forwards; border-color: #ef4444; background-color: #fff1f2; }

        /* Timer flash text */
        @keyframes floatUp {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-30px) scale(0.8); }
        }
        .float-text { animation: floatUp 1s ease-out forwards; pointer-events: none; }

        /* Timeout flash overlay */
        @keyframes flashRed {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            80%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .timeout-flash { animation: flashRed 1s ease-out forwards; }

        /* Board clear flash */
        @keyframes flashWhite {
            0%   { opacity: 0; }
            30%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .board-clear-flash { animation: flashWhite 0.5s ease-out forwards; }

        /* Stats tile stagger */
        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* New record animation */
        @keyframes recordPop {
            0%   { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            60%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .record-pop { animation: recordPop 0.5s ease-out forwards; }

        /* Mute button */
        .mute-btn {
            background: white; border: 2px solid #fbcfe8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s;
        }
        .mute-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const ABLY_KEY = '4opURQ.FVPiqg:z5W8zQxWoBNlXmlAXvOv4Bz1bmn_ISnFucJGpjFijS8';
        const globalClientId = Math.random().toString(36).substr(2, 8);
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: globalClientId, echoMessages: false }); 

        const ROWS = 16; 
        const COLS = 10;
        
        const ALL_CUTE_POKEMON = [
            1, 4, 7, 10, 13, 16, 25, 27, 35, 37, 39, 43, 50, 52, 54, 58, 60, 74, 79, 86, 90, 104, 116, 133, 143, 147, 151, 
            152, 155, 158, 161, 165, 172, 173, 174, 175, 179, 183, 187, 191, 194, 216, 220, 228, 231, 238, 246, 251, 252, 255, 
            258, 261, 265, 270, 273, 280, 283, 285, 298, 300, 304, 307, 309, 311, 316, 320, 327, 331, 355, 361, 385, 387, 390, 
            393, 396, 399, 401, 403, 406, 417, 425, 427, 431, 433, 438, 439, 440, 443, 446, 447, 453, 458, 489, 490, 495, 498, 
            501, 504, 506, 509, 517, 522, 532, 546, 548, 572, 585, 587, 610, 653, 656, 659, 661, 664, 667, 669, 674, 677, 701, 
            704, 707, 714, 722, 725, 728, 731, 736, 742, 747, 753, 755, 759, 761, 764, 775, 777, 778, 810, 813, 816, 819, 821, 
            825, 827, 829, 846, 850, 854, 856, 872, 874, 877, 888, 906, 909, 912, 915, 917, 921, 925, 938, 946
        ];

        // ===================== WEB AUDIO ENGINE =====================
        const AudioEngine = (() => {
            let ctx = null;
            let muted = false;

            const getCtx = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx;
            };

            const play = (freqs, dur, type = 'sine', vol = 0.3, delay = 0) => {
                if (muted) return;
                try {
                    const ac = getCtx();
                    freqs.forEach(({ f, t, d }, i) => {
                        const osc = ac.createOscillator();
                        const gain = ac.createGain();
                        osc.connect(gain); gain.connect(ac.destination);
                        osc.type = type;
                        osc.frequency.setValueAtTime(f, ac.currentTime + delay + t);
                        gain.gain.setValueAtTime(vol, ac.currentTime + delay + t);
                        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + t + d);
                        osc.start(ac.currentTime + delay + t);
                        osc.stop(ac.currentTime + delay + t + d + 0.05);
                    });
                } catch(e) {}
            };

            return {
                setMuted: (m) => { muted = m; },
                isMuted: () => muted,
                match: () => play([
                    { f: 523, t: 0, d: 0.1 },
                    { f: 659, t: 0.08, d: 0.1 },
                    { f: 784, t: 0.16, d: 0.2 }
                ], 0.4, 'triangle', 0.25),
                wrong: () => play([{ f: 180, t: 0, d: 0.1 }], 0.1, 'sawtooth', 0.15),
                hint: () => play([{ f: 880, t: 0, d: 0.2 }], 0.2, 'sine', 0.2),
                shuffle: () => {
                    const notes = [400, 500, 350, 600, 450];
                    play(notes.map((f, i) => ({ f, t: i * 0.05, d: 0.1 })), 0.3, 'sine', 0.2);
                },
                tick: (n) => {
                    const f = n === 'GO!' ? 880 : (n === 1 ? 660 : n === 2 ? 587 : 523);
                    play([{ f, t: 0, d: n === 'GO!' ? 0.3 : 0.15 }], 0.15, 'triangle', 0.3);
                },
                levelClear: () => play([
                    { f: 523, t: 0, d: 0.1 },
                    { f: 659, t: 0.1, d: 0.1 },
                    { f: 784, t: 0.2, d: 0.1 },
                    { f: 1047, t: 0.3, d: 0.3 }
                ], 0.5, 'triangle', 0.25),
                gameOver: () => play([
                    { f: 440, t: 0, d: 0.15 },
                    { f: 370, t: 0.15, d: 0.15 },
                    { f: 294, t: 0.3, d: 0.3 }
                ], 0.5, 'sawtooth', 0.2),
                timeout: () => play([
                    { f: 300, t: 0, d: 0.2 },
                    { f: 220, t: 0.2, d: 0.3 }
                ], 0.5, 'sawtooth', 0.2),
            };
        })();

        // ===================== SVG ICONS =====================
        const IconHeart = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#fb7185" className="w-5 h-5"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z" /></svg>;
        const IconSearch = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" /></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>;
        const IconPause = () => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6"><path fillRule="evenodd" d="M6.75 5.25a.75.75 0 01.75-.75H9a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H7.5a.75.75 0 01-.75-.75V5.25zm7.5 0A.75.75 0 0115 4.5h1.5a.75.75 0 01.75.75v13.5a.75.75 0 01-.75.75H15a.75.75 0 01-.75-.75V5.25z" clipRule="evenodd" /></svg>;
        const IconMute = ({ muted }) => muted
            ? <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.531V19.94a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.506-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.395C2.806 8.757 3.63 8.25 4.51 8.25H6.75z" /></svg>
            : <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.395C2.806 8.757 3.63 8.25 4.51 8.25H6.75z" /></svg>;

        // --- ALGORITMA PATHFINDING ---
        const isPathClear = (board, r1, c1, r2, c2) => {
            if (r1 === r2) {
                const minC = Math.min(c1, c2); const maxC = Math.max(c1, c2);
                for (let c = minC + 1; c < maxC; c++) if (board[r1][c] !== 0) return false;
                return true;
            }
            if (c1 === c2) {
                const minR = Math.min(r1, r2); const maxR = Math.max(r1, r2);
                for (let r = minR + 1; r < maxR; r++) if (board[r][c1] !== 0) return false;
                return true;
            }
            return false;
        };

        const getPath = (board, r1, c1, r2, c2) => {
            if (r1 === r2 && c1 === c2) return null; 
            if (board[r1][c1] !== board[r2][c2]) return null;
            if (board[r1][c1] === 0) return null; 

            if ((r1 === r2 || c1 === c2) && isPathClear(board, r1, c1, r2, c2)) return [{r: r1, c: c1}, {r: r2, c: c2}]; 
            if (board[r1][c2] === 0 && isPathClear(board, r1, c1, r1, c2) && isPathClear(board, r1, c2, r2, c2)) return [{r: r1, c: c1}, {r: r1, c: c2}, {r: r2, c: c2}];
            if (board[r2][c1] === 0 && isPathClear(board, r1, c1, r2, c1) && isPathClear(board, r2, c1, r2, c2)) return [{r: r1, c: c1}, {r: r2, c: c1}, {r: r2, c: c2}];

            for (let dir = -1; dir <= 1; dir += 2) {
                let c = c1 + dir;
                while (c >= 0 && c < COLS + 2 && board[r1][c] === 0) {
                    if (board[r2][c] === 0 && isPathClear(board, r1, c, r2, c) && isPathClear(board, r2, c, r2, c2)) return [{r: r1, c: c1}, {r: r1, c}, {r: r2, c}, {r: r2, c: c2}];
                    c += dir;
                }
            }
            for (let dir = -1; dir <= 1; dir += 2) {
                let r = r1 + dir;
                while (r >= 0 && r < ROWS + 2 && board[r][c1] === 0) {
                    if (board[r][c2] === 0 && isPathClear(board, r, c1, r, c2) && isPathClear(board, r, c2, r2, c2)) return [{r: r1, c: c1}, {r, c: c1}, {r, c: c2}, {r: r2, c: c2}];
                    r += dir;
                }
            }
            return null; 
        };

        const findHint = (board) => {
            for (let i = 1; i <= ROWS; i++) {
                for (let j = 1; j <= COLS; j++) {
                    if (board[i][j] !== 0) {
                        for (let k = 1; k <= ROWS; k++) {
                            for (let l = 1; l <= COLS; l++) {
                                if ((i !== k || j !== l) && board[i][j] === board[k][l]) {
                                    const path = getPath(board, i, j, k, l);
                                    if (path) return {p1: {r: i, c: j}, p2: {r: k, c: l}, path};
                                }
                            }
                        }
                    }
                }
            }
            return null;
        };

        // ===================== TIMER CALC =====================
        // Speed: 0.05 + (level * 0.02) per 200ms tick
        // Level 1: 0.07/200ms = 0.35/s → 100/0.35 ≈ 286s (4.7 menit) — nah ini terlalu banyak
        // Adjusted: 0.08 + (level * 0.025) per 200ms
        // Level 1: 0.105/200ms → 100/0.525 ≈ 190s
        // Level 5: 0.205/200ms → 100/1.025 ≈ 97s
        // Level 10: 0.33/200ms → 100/1.65 ≈ 61s — lebih balanced
        const getTimerSpeed = (level) => 0.08 + (level * 0.025);

        const getSecondsLeft = (progress, level) => {
            const speed = getTimerSpeed(level);
            const ticksLeft = progress / speed;
            return Math.ceil(ticksLeft * 0.2);
        };

        // ===================== MATCHMAKING SCREEN COMPONENT =====================
        const MatchmakingScreen = ({ multiMode, playerName, onCancel, onRetry }) => {
            const [elapsed, setElapsed] = React.useState(0);
            const [dots, setDots] = React.useState('');
            const [timedOut, setTimedOut] = React.useState(false);

            React.useEffect(() => {
                const start = Date.now();
                const tick = setInterval(() => {
                    const s = Math.floor((Date.now() - start) / 1000);
                    setElapsed(s);
                    setDots(prev => prev.length >= 3 ? '' : prev + '.');
                    if (s >= 30 && !timedOut) setTimedOut(true);
                }, 500);
                return () => clearInterval(tick);
            }, []);

            const modeLabel = multiMode === 'COOP' ? 'Co-op' : 'Versus';
            const modeColor = multiMode === 'COOP' ? 'text-teal-500' : 'text-red-500';
            const spinColor = multiMode === 'COOP' ? 'border-teal-400' : 'border-red-400';

            return (
                <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100] px-6">
                    {!timedOut ? (
                        <>
                            <div className={`animate-spin rounded-full h-14 w-14 border-t-4 border-b-4 ${spinColor} mb-6`}></div>
                            <h2 className={`text-2xl font-black ${modeColor} mb-1`}>Mencari Pemain{dots}</h2>
                            <p className="text-gray-400 font-bold text-sm mb-1">Mode: <span className={`font-black ${modeColor}`}>{modeLabel}</span></p>
                            <p className="text-gray-300 font-bold text-xs mb-8">{elapsed}s berlalu</p>
                            <div className="w-full max-w-[260px] bg-pink-50 border-2 border-pink-100 rounded-2xl p-4 mb-6 text-center">
                                <p className="text-gray-500 font-bold text-sm">Menunggu pemain lain masuk lobby.</p>
                                <p className="text-gray-400 text-xs mt-1">Kamu: <span className="text-pink-500 font-black">{playerName}</span></p>
                            </div>
                            <button onClick={onCancel} className="text-gray-400 font-bold underline text-sm">Batal</button>
                        </>
                    ) : (
                        <>
                            <div className="text-5xl mb-4">😴</div>
                            <h2 className="text-xl font-black text-gray-500 mb-2 text-center">Belum ada pemain lain...</h2>
                            <p className="text-gray-400 font-bold text-sm text-center mb-6 px-4">Sudah {elapsed}s menunggu. Coba lagi atau main sendiri dulu.</p>
                            <button onClick={onRetry} className="cute-btn-text px-8 py-3 text-base font-bold mb-3">Cari Lagi</button>
                            <button onClick={onCancel} className="text-gray-400 font-bold underline text-sm">Kembali ke Menu</button>
                        </>
                    )}
                </div>
            );
        };

        const App = () => {
            const [playerName, setPlayerName] = useState(() => localStorage.getItem('pkmnPlayerName') || '');
            const [loginError, setLoginError] = useState('');
            const [opponentName, setOpponentName] = useState('');
            const [gameState, setGameState] = useState(playerName ? 'LOBBY_MAIN' : 'LOGIN'); 
            
            const [board, setBoard] = useState([]);
            const [level, setLevel] = useState(1);
            const [score, setScore] = useState(0);
            const [hp, setHp] = useState(3);
            const [progress, setProgress] = useState(100); 
            const [hints, setHints] = useState(3);
            const [shuffles, setShuffles] = useState(3);
            const [selectedTile, setSelectedTile] = useState(null);
            
            const [matchedTiles, setMatchedTiles] = useState([]); 
            const [hintActiveTiles, setHintActiveTiles] = useState([]); 
            const [activePath, setActivePath] = useState(null); 
            const [wrongTile, setWrongTile] = useState(null);
            const [connectionStatus, setConnectionStatus] = useState('connected');

            // UI feedback states
            const [showTimerAdd, setShowTimerAdd] = useState(false);
            const [showTimeoutFlash, setShowTimeoutFlash] = useState(false);
            const [showBoardClear, setShowBoardClear] = useState(false);
            const [isMuted, setIsMuted] = useState(() => localStorage.getItem('pkmnMuted') === 'true');
            const [isNewRecord, setIsNewRecord] = useState(false);

            // Deadlock auto-detect interval
            const deadlockCheckRef = useRef(null);

            // Multiplayer States
            const [multiMode, setMultiMode] = useState('SINGLE'); 
            const [isHost, setIsHost] = useState(true);
            const [opponentScore, setOpponentScore] = useState(0);
            const [coopSummary, setCoopSummary] = useState({ myConnects: 0, allyConnects: 0, myTotalTime: 0, allyTotalTime: 0 });
            const statsRef = useRef({ myConnects: 0, allyConnects: 0, myTotalTime: 0, allyTotalTime: 0, lastActionTime: 0 });

            const [countdown, setCountdown] = useState(null);

            const isAnimating = useRef(false);
            const channelRef = useRef(null);
            const matchmakingChannelRef = useRef(null);
            const boardRef = useRef(board);
            const pendingMatchRef = useRef(false);
            const startAtRef = useRef(null);
            const hostLoadedCountRef = useRef(0);
            const hostSelfLoadedRef = useRef(false);
            const progressRef = useRef(100);
            const levelRef = useRef(1);
            const guestJoinSentRef = useRef(false);
            
            useEffect(() => { boardRef.current = board; }, [board]);
            useEffect(() => { progressRef.current = progress; }, [progress]);
            useEffect(() => { levelRef.current = level; }, [level]);

            // Mute toggle
            useEffect(() => {
                AudioEngine.setMuted(isMuted);
                localStorage.setItem('pkmnMuted', isMuted);
            }, [isMuted]);

            // Monitor koneksi Ably
            useEffect(() => {
                ably.connection.on('connected', () => setConnectionStatus('connected'));
                ably.connection.on('disconnected', () => setConnectionStatus('disconnected'));
                ably.connection.on('suspended', () => setConnectionStatus('disconnected'));
                ably.connection.on('failed', () => setConnectionStatus('disconnected'));
                return () => ably.connection.off();
            }, []);

            // Deadlock auto-detection every 3 seconds
            useEffect(() => {
                if (deadlockCheckRef.current) clearInterval(deadlockCheckRef.current);
                if (gameState !== 'PLAYING') return;
                deadlockCheckRef.current = setInterval(() => {
                    const b = boardRef.current;
                    if (!b || b.length === 0) return;
                    if (!findHint(b)) {
                        // Deadlock! Auto-shuffle
                        if (multiMode === 'COOP' && !isHost) return;
                        const newB = guaranteedShuffle(b);
                        setBoard(newB);
                        if (multiMode === 'COOP' && isHost) {
                            channelRef.current?.publish('action', { type: 'SYNC_SHUFFLE', board: newB });
                        }
                    }
                }, 3000);
                return () => clearInterval(deadlockCheckRef.current);
            }, [gameState, multiMode, isHost]);

            const handleLogin = () => {
                if (playerName.trim()) {
                    localStorage.setItem('pkmnPlayerName', playerName.trim());
                    setLoginError('');
                    setGameState('LOBBY_MAIN');
                } else {
                    setLoginError('Namanya diisi dulu ya!');
                }
            };

            const generateBoard = useCallback(() => {
                const newBoard = Array.from({ length: ROWS + 2 }, () => Array(COLS + 2).fill(0));
                let shuffledPool = [...ALL_CUTE_POKEMON].sort(() => Math.random() - 0.5);
                let selectedIds = shuffledPool.slice(0, (ROWS * COLS) / 4); 

                let tiles = [];
                selectedIds.forEach(id => { tiles.push(id, id, id, id); });
                tiles.sort(() => Math.random() - 0.5);

                let idx = 0;
                for (let r = 1; r <= ROWS; r++) {
                    for (let c = 1; c <= COLS; c++) { newBoard[r][c] = tiles[idx++]; }
                }
                
                let attempts = 0;
                while (!findHint(newBoard) && attempts < 10) {
                    tiles.sort(() => Math.random() - 0.5);
                    idx = 0;
                    for (let r = 1; r <= ROWS; r++) {
                        for (let c = 1; c <= COLS; c++) { newBoard[r][c] = tiles[idx++]; }
                    }
                    attempts++;
                }
                return newBoard;
            }, []);

            // Guaranteed shuffle — no 20-attempt limit
            const guaranteedShuffle = (currentBoard) => {
                let tiles = []; let pos = [];
                for (let r = 1; r <= ROWS; r++) {
                    for (let c = 1; c <= COLS; c++) {
                        if (currentBoard[r][c] !== 0) { tiles.push(currentBoard[r][c]); pos.push({r, c}); }
                    }
                }
                if (tiles.length === 0) return currentBoard;
                let newB = [...currentBoard.map(row => [...row])];
                
                // Try up to 50 random shuffles
                for (let attempt = 0; attempt < 50; attempt++) {
                    tiles.sort(() => Math.random() - 0.5);
                    for (let i = 0; i < pos.length; i++) { newB[pos[i].r][pos[i].c] = tiles[i]; }
                    if (findHint(newB)) return newB;
                }
                
                // Forced fallback: pair first two tiles that share same id and move them to adjacent corners
                for (let i = 0; i < tiles.length; i++) {
                    for (let j = i + 1; j < tiles.length; j++) {
                        if (tiles[i] === tiles[j]) {
                            // Place them at border-adjacent positions
                            newB[pos[0].r][pos[0].c] = tiles[i];
                            newB[pos[1].r][pos[1].c] = tiles[j];
                            if (findHint(newB)) return newB;
                        }
                    }
                }
                return newB; // last resort, return as-is
            };

            // --- PRE-LOAD IMAGES ---
            const preloadBoardImages = async (boardData) => {
                setGameState('LOADING_BOARD');
                setProgress(0); 

                const uniqueIds = new Set();
                for(let r = 1; r <= ROWS; r++) {
                    for(let c = 1; c <= COLS; c++) {
                        if(boardData[r][c] !== 0) uniqueIds.add(boardData[r][c]);
                    }
                }
                const ids = Array.from(uniqueIds);
                let loadedCount = 0;

                const loadPromises = ids.map(id => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
                        img.onload = () => { loadedCount++; setProgress(Math.floor((loadedCount / ids.length) * 100)); resolve(); };
                        img.onerror = () => { loadedCount++; resolve(); };
                    });
                });

                const timeoutPromise = new Promise(resolve => setTimeout(resolve, 8000));
                await Promise.race([Promise.all(loadPromises), timeoutPromise]);
            };

            const prepareLevel = async (startLevel = 1, providedBoard = null) => {
                const b = providedBoard || generateBoard();
                setBoard(b);
                setLevel(startLevel);
                levelRef.current = startLevel;
                if (startLevel === 1) {
                    setScore(0); setHp(3); setHints(3); setShuffles(3); setOpponentScore(0);
                    setIsNewRecord(false);
                }
                
                await preloadBoardImages(b);

                if (multiMode === 'SINGLE') {
                    runCountdownThenPlay(Date.now());
                } else {
                    channelRef.current?.publish('action', { type: 'PLAYER_LOADED' });
                    setGameState('WAITING_BOTH_LOADED');

                    if (isHost) {
                        hostSelfLoadedRef.current = true;
                        if (hostLoadedCountRef.current >= 1) triggerSyncedStart();
                    }
                }
            };

            const triggerSyncedStart = () => {
                hostLoadedCountRef.current = 0;
                hostSelfLoadedRef.current = false;
                const startAt = Date.now() + 500;
                channelRef.current?.publish('action', { type: 'START_AT', startAt });
                runCountdownThenPlay(startAt);
            };

            const runCountdownThenPlay = (startAt) => {
                setProgress(100);
                setGameState('COUNTDOWN');
                const steps = [
                    { label: 3, offset: -3000 },
                    { label: 2, offset: -2000 },
                    { label: 1, offset: -1000 },
                    { label: 'GO!', offset: 0 },
                ];
                steps.forEach(({ label, offset }) => {
                    const delay = Math.max(0, (startAt + offset) - Date.now());
                    setTimeout(() => {
                        setCountdown(label);
                        AudioEngine.tick(label);
                    }, delay);
                });
                const playDelay = Math.max(0, (startAt + 700) - Date.now());
                setTimeout(() => {
                    setCountdown(null);
                    setSelectedTile(null);
                    setMatchedTiles([]);
                    setActivePath(null);
                    setHintActiveTiles([]);
                    isAnimating.current = false;
                    statsRef.current = { myConnects: 0, allyConnects: 0, myTotalTime: 0, allyTotalTime: 0, lastActionTime: Date.now() };
                    setGameState('PLAYING');
                }, playDelay);
            };

            const finalizeStart = () => {
                setCountdown(null);
                setSelectedTile(null);
                setMatchedTiles([]);
                setActivePath(null);
                setHintActiveTiles([]);
                isAnimating.current = false;
                setProgress(100);
                setGameState('PLAYING');
                statsRef.current = { myConnects: 0, allyConnects: 0, myTotalTime: 0, allyTotalTime: 0, lastActionTime: Date.now() };
            };

            // ===================== MATCHMAKING =====================
            const cleanupChannels = () => {
                if (matchmakingChannelRef.current) {
                    try { matchmakingChannelRef.current.presence.leave(); } catch(e) {}
                    try { matchmakingChannelRef.current.unsubscribe(); } catch(e) {}
                    try { matchmakingChannelRef.current.presence.unsubscribe(); } catch(e) {}
                    matchmakingChannelRef.current = null;
                }
                if (channelRef.current) {
                    try { channelRef.current.presence.leave(); } catch(e) {}
                    try { channelRef.current.unsubscribe(); } catch(e) {}
                    try { channelRef.current.presence.unsubscribe(); } catch(e) {}
                    channelRef.current = null;
                }
                hostLoadedCountRef.current = 0;
                hostSelfLoadedRef.current = false;
                pendingMatchRef.current = false;  // FIX: always reset on cleanup
                guestJoinSentRef.current = false;
                setConnectionStatus('connected');
            };

            const startMatchmaking = (mode) => {
                cleanupChannels();
                setMultiMode(mode);
                setGameState('MATCHMAKING');

                // FIX: use a versioned channel name per session to avoid stale presence data
                const lobbyChannel = ably.channels.get(`pkmn-lobby-${mode}-v3`);
                matchmakingChannelRef.current = lobbyChannel;

                lobbyChannel.attach((attachErr) => {
                    if (attachErr) { console.error('Lobby attach error:', attachErr); setGameState('LOBBY_MAIN'); return; }

                    // FIX: add small delay after attach before reading presence, to let Ably
                    // sync the member list fully (avoids stale/empty presence on reconnect)
                    setTimeout(() => {
                        lobbyChannel.presence.get((err, members) => {
                            // FIX: filter out stale hosts (present for >60s) which may be ghost entries
                            const now = Date.now();
                            const waitingHosts = (members || []).filter(m =>
                                m.data && m.data.roomId && m.clientId !== globalClientId
                            );

                            if (err || waitingHosts.length === 0) {
                                // --- BECOME HOST ---
                                setIsHost(true);
                                const newRoomId = Math.random().toString(36).substr(2, 8);
                                const privateChannel = ably.channels.get(`pkmn-room-${newRoomId}`);
                                channelRef.current = privateChannel;

                                privateChannel.attach((roomAttachErr) => {
                                    if (roomAttachErr) { console.error('Room attach error:', roomAttachErr); setGameState('LOBBY_MAIN'); return; }

                                    // FIX: subscribe to room BEFORE entering lobby presence,
                                    // so we never miss a GUEST_READY message
                                    setupRoomListeners(privateChannel, true, mode);

                                    lobbyChannel.presence.enter({ roomId: newRoomId, hostName: playerName, ts: Date.now() }, (presErr) => {
                                        if (presErr) console.error('Presence enter error:', presErr);
                                    });

                                    // FIX: lobby presence subscribe was empty before — now handles
                                    // the race where guest joins lobby AFTER host's presence.get()
                                    // This path is no longer needed since guest goes directly to the
                                    // private room, but we subscribe anyway for safety/logging.
                                    lobbyChannel.presence.subscribe('enter', (member) => {
                                        if (member.clientId === globalClientId) return;
                                        // Guest found us via presence.get or shortly after — no action needed,
                                        // guest will send GUEST_READY to our private room channel directly.
                                    });
                                });

                            } else {
                                // --- BECOME GUEST ---
                                setIsHost(false);
                                const targetHost = waitingHosts[0];
                                const targetRoom = targetHost.data.roomId;
                                setOpponentName(targetHost.data.hostName);

                                const privateChannel = ably.channels.get(`pkmn-room-${targetRoom}`);
                                channelRef.current = privateChannel;

                                privateChannel.attach((roomAttachErr) => {
                                    if (roomAttachErr) { console.error('Room attach error:', roomAttachErr); setGameState('LOBBY_MAIN'); return; }

                                    // FIX: subscribe to room listener BEFORE publishing anything
                                    setupRoomListeners(privateChannel, false, mode);

                                    // FIX: leave lobby BEFORE sending join signal, so host can't
                                    // accidentally match another player to us
                                    try { lobbyChannel.presence.leave(); } catch(e) {}

                                    // FIX: add a short delay after attach so host's subscribe()
                                    // is guaranteed to be active before we publish
                                    setTimeout(() => {
                                        if (!guestJoinSentRef.current && channelRef.current) {
                                            guestJoinSentRef.current = true;
                                            privateChannel.publish('action', { type: 'GUEST_READY', guestName: playerName });
                                        }
                                    }, 300);
                                });
                            }
                        });
                    }, 400); // small presence-sync delay
                });
            };

            const setupRoomListeners = (ch, amIHost, mode) => {
                ch.unsubscribe('action');
                ch.subscribe('action', (msg) => {
                    const data = msg.data;

                    // FIX: renamed GUEST_JOIN → GUEST_READY so intent is clear,
                    // and host only reacts once (idempotent guard via matchmakingChannelRef)
                    if (data.type === 'GUEST_READY' && amIHost) {
                        // Guard: ignore if we already started a game (duplicate message protection)
                        if (!matchmakingChannelRef.current) return;
                        setOpponentName(data.guestName);
                        // Leave lobby so no other guest can join
                        try { matchmakingChannelRef.current.presence.leave(); } catch(e) {}
                        try { matchmakingChannelRef.current.unsubscribe(); } catch(e) {}
                        try { matchmakingChannelRef.current.presence.unsubscribe(); } catch(e) {}
                        matchmakingChannelRef.current = null;

                        const newB = generateBoard();
                        // FIX: send START_GAME_SYNC with a small delay so guest's subscribe
                        // is fully established before the message arrives
                        setTimeout(() => {
                            ch.publish('action', { type: 'START_GAME_SYNC', board: newB, mode: mode, hostName: playerName });
                        }, 150);
                        prepareLevel(1, newB);
                    }

                    if (data.type === 'START_GAME_SYNC' && !amIHost) {
                        setMultiMode(data.mode);
                        setOpponentName(data.hostName);
                        prepareLevel(1, data.board);
                    }

                    if (data.type === 'PLAYER_LOADED' && amIHost) {
                        hostLoadedCountRef.current += 1;
                        if (hostSelfLoadedRef.current) triggerSyncedStart();
                    }

                    if (data.type === 'START_AT') runCountdownThenPlay(data.startAt);

                    if (data.type === 'VS_SCORE') setOpponentScore(s => s + data.delta);
                    if (data.type === 'COOP_MATCH') handleRemoteMatch(data.r1, data.c1, data.r2, data.c2, data.path);

                    if (data.type === 'NEXT_LEVEL_SYNC' && !amIHost) {
                        setProgress(100);
                        prepareLevel(data.level, data.board);
                    }

                    if (data.type === 'SYNC_SHUFFLE' && !amIHost) setBoard(data.board);

                    // Guest bisa request shuffle di co-op
                    if (data.type === 'REQUEST_SHUFFLE' && amIHost) {
                        const newB = guaranteedShuffle(boardRef.current);
                        setBoard(newB);
                        setShuffles(s => Math.max(0, s - 1));
                        ch.publish('action', { type: 'SYNC_SHUFFLE', board: newB });
                    }

                    // Rematch
                    if (data.type === 'REMATCH_SYNC' && !amIHost) {
                        setMultiMode(mode);
                        prepareLevel(1, data.board);
                    }
                });

                // FIX: only fire opponent_left if we're currently in an active game state
                // (avoid false triggers during setup/transition)
                ch.presence.subscribe('leave', (member) => {
                    if (member.clientId === globalClientId) return;
                    setGameState(prev => {
                        if (prev === 'PLAYING' || prev === 'COUNTDOWN' || prev === 'WAITING_BOTH_LOADED') {
                            setConnectionStatus('opponent_left');
                            return 'GAMEOVER';
                        }
                        return prev;
                    });
                });

                ch.presence.enter({ name: amIHost ? 'host' : 'guest' }).catch(e => console.warn('presence enter fail', e));
            };

            const cancelMatchmaking = () => {
                cleanupChannels();
                setMultiMode('SINGLE');
                setGameState('LOBBY_MAIN');
            };

            // ===================== TIMER =====================
            useEffect(() => {
                if (gameState !== 'PLAYING') return;
                const speed = getTimerSpeed(level);
                const timer = setInterval(() => {
                    setProgress(prev => {
                        if (prev <= 0) { clearInterval(timer); handleTimeout(); return 0; }
                        return prev - speed; 
                    });
                }, 200);
                return () => clearInterval(timer);
            }, [gameState, level]);

            const triggerLevelEndStats = (isGameOver = false) => {
                setCoopSummary({
                    myConnects: statsRef.current.myConnects,
                    allyConnects: statsRef.current.allyConnects,
                    myTotalTime: statsRef.current.myTotalTime,
                    allyTotalTime: statsRef.current.allyTotalTime,
                });

                if (isGameOver) {
                    AudioEngine.gameOver();
                    setGameState('GAMEOVER');
                } else {
                    // Board clear flash before WON
                    AudioEngine.levelClear();
                    setShowBoardClear(true);
                    setTimeout(() => {
                        setShowBoardClear(false);
                        setGameState('WON');
                    }, 500);
                }

                if (!isGameOver && multiMode !== 'COOP') {
                    setTimeout(() => {
                        const newB = generateBoard();
                        if (isHost && multiMode !== 'SINGLE') {
                            channelRef.current?.publish('action', { type: 'NEXT_LEVEL_SYNC', board: newB, level: level + 1 });
                        }
                        prepareLevel(level + 1, newB);
                    }, 2500);
                }
            };

            const handleTimeout = () => {
                AudioEngine.timeout();
                // Show timeout flash overlay first
                setShowTimeoutFlash(true);
                setTimeout(() => {
                    setShowTimeoutFlash(false);
                    if (hp > 1) {
                        setHp(h => h - 1);
                        if (multiMode !== 'SINGLE' && !isHost) return;
                        const newB = generateBoard();
                        if (isHost && multiMode !== 'SINGLE') {
                            channelRef.current?.publish('action', { type: 'NEXT_LEVEL_SYNC', board: newB, level: level });
                        }
                        prepareLevel(level, newB); 
                    } else {
                        triggerLevelEndStats(true);
                    }
                }, 1000);
            };

            const performShuffle = (currentBoard) => guaranteedShuffle(currentBoard);

            const handleShuffleClick = () => {
                if (shuffles > 0 && gameState === 'PLAYING' && !isAnimating.current) {
                    if (multiMode === 'COOP' && !isHost) {
                        // Guest request shuffle ke host
                        channelRef.current?.publish('action', { type: 'REQUEST_SHUFFLE' });
                        return;
                    }
                    setShuffles(s => s - 1);
                    AudioEngine.shuffle();
                    const newB = performShuffle(board);
                    setBoard(newB);
                    setSelectedTile(null);
                    if (multiMode === 'COOP' && isHost) channelRef.current?.publish('action', { type: 'SYNC_SHUFFLE', board: newB });
                }
            };

            const handleHintClick = () => {
                if (hints > 0 && gameState === 'PLAYING' && !isAnimating.current) {
                    const hintData = findHint(board);
                    if (hintData) {
                        setHints(h => h - 1);
                        AudioEngine.hint();
                        setHintActiveTiles([{r: hintData.p1.r, c: hintData.p1.c}, {r: hintData.p2.r, c: hintData.p2.c}]);
                        setTimeout(() => { if(!isAnimating.current) setHintActiveTiles([]); }, 1200); 
                    }
                }
            };

            const checkLevelComplete = (b) => {
                let empty = true;
                for (let r = 1; r <= ROWS; r++) {
                    for (let c = 1; c <= COLS; c++) { if (b[r][c] !== 0) empty = false; }
                }
                if (empty) {
                    triggerLevelEndStats(false);
                    return true;
                }
                if (!findHint(b)) {
                    if (multiMode === 'COOP' && !isHost) return; 
                    const newB = guaranteedShuffle(b);
                    setBoard(newB);
                    if (multiMode === 'COOP' && isHost) channelRef.current?.publish('action', { type: 'SYNC_SHUFFLE', board: newB });
                }
                return false;
            };

            const handleRemoteMatch = useCallback((r1, c1, r2, c2, path) => {
                if (isAnimating.current || pendingMatchRef.current) return;
                pendingMatchRef.current = true;
                isAnimating.current = true;
                setHintActiveTiles([]); 
                setActivePath(path);
                
                const b = boardRef.current;
                if (b[r1][c1] === 0 || b[r2][c2] === 0) { 
                    isAnimating.current = false; 
                    pendingMatchRef.current = false;
                    return; 
                }

                setMatchedTiles([ {r: r1, c: c1, id: b[r1][c1]}, {r: r2, c: c2, id: b[r2][c2]} ]);
                const now = Date.now();
                statsRef.current.allyTotalTime += (now - statsRef.current.lastActionTime);
                statsRef.current.allyConnects += 1;
                statsRef.current.lastActionTime = now;

                setTimeout(() => {
                    setBoard(prev => {
                        const newBoard = [...prev.map(row => [...row])];
                        newBoard[r1][c1] = 0; newBoard[r2][c2] = 0;
                        checkLevelComplete(newBoard);
                        return newBoard;
                    });
                    setSelectedTile(null); setActivePath(null); setMatchedTiles([]); 
                    setScore(s => s + 10); setProgress(p => Math.min(100, p + 4)); 
                    isAnimating.current = false;
                    pendingMatchRef.current = false;
                }, 350);
            }, []);

            const handleTileClick = (r, c) => {
                if (gameState !== 'PLAYING' || isAnimating.current || pendingMatchRef.current || board[r][c] === 0) return;
                if (selectedTile && selectedTile.r === r && selectedTile.c === c) { setSelectedTile(null); return; }
                if (!selectedTile) { setSelectedTile({r, c}); return; }

                const path = getPath(board, selectedTile.r, selectedTile.c, r, c);
                
                if (path) {
                    isAnimating.current = true;
                    pendingMatchRef.current = true;
                    setHintActiveTiles([]); 
                    setActivePath(path);
                    AudioEngine.match();
                    
                    const r1 = selectedTile.r; const c1 = selectedTile.c;
                    const id1 = board[r1][c1]; const id2 = board[r][c];
                    setMatchedTiles([ {r: r1, c: c1, id: id1}, {r, c, id: id2} ]);

                    const now = Date.now();
                    statsRef.current.myTotalTime += (now - statsRef.current.lastActionTime);
                    statsRef.current.myConnects += 1;
                    statsRef.current.lastActionTime = now;

                    if (multiMode === 'COOP') channelRef.current?.publish('action', { type: 'COOP_MATCH', r1, c1, r2: r, c2: c, path });
                    if (multiMode === 'VERSUS') channelRef.current?.publish('action', { type: 'VS_SCORE', delta: 10 });

                    // Timer add feedback
                    setShowTimerAdd(true);
                    setTimeout(() => setShowTimerAdd(false), 900);

                    setTimeout(() => {
                        const newBoard = [...board.map(row => [...row])];
                        newBoard[r1][c1] = 0; newBoard[r][c] = 0;
                        setBoard(newBoard);
                        
                        setSelectedTile(null); setActivePath(null); setMatchedTiles([]); 
                        setScore(s => {
                            const ns = s + 10;
                            const best = parseInt(localStorage.getItem('pkmnBestScore') || '0');
                            if (ns > best) {
                                localStorage.setItem('pkmnBestScore', ns);
                                setIsNewRecord(true);
                            }
                            return ns;
                        });
                        setProgress(p => Math.min(100, p + 4)); 
                        isAnimating.current = false;
                        pendingMatchRef.current = false;
                        checkLevelComplete(newBoard);
                    }, 350); 

                } else {
                    AudioEngine.wrong();
                    setWrongTile({r, c});
                    setTimeout(() => setWrongTile(null), 380);
                    setSelectedTile({r, c});
                }
            };

            const handleRematch = () => {
                if (isHost) {
                    const newB = generateBoard();
                    channelRef.current?.publish('action', { type: 'REMATCH_SYNC', board: newB });
                    prepareLevel(1, newB);
                } else {
                    // Guest menunggu host rematch — bisa tampilkan waiting state
                    // Untuk sekarang: kembali ke lobby
                    cleanupChannels();
                    setMultiMode('SINGLE');
                    setGameState('LOBBY_MAIN');
                }
            };

            // ===================== CO-OP STATS =====================
            const getAvgTime = () => {
                const total = coopSummary.myConnects + coopSummary.allyConnects;
                if(total === 0) return "0.0";
                return ((coopSummary.myTotalTime + coopSummary.allyTotalTime) / total / 1000).toFixed(1);
            };
            const getMVP = () => {
                if(coopSummary.myConnects > coopSummary.allyConnects) return playerName;
                if(coopSummary.allyConnects > coopSummary.myConnects) return opponentName;
                return "Seimbang";
            };
            const getRating = () => {
                const avg = parseFloat(getAvgTime());
                if (avg === 0) return { grade: '-', color: 'text-gray-400' };
                if (avg <= 2.5) return { grade: 'SSS', color: 'text-yellow-400 drop-shadow-[0_0_12px_rgba(250,204,21,0.8)]' };
                if (avg <= 4.0) return { grade: 'S', color: 'text-yellow-400 drop-shadow-md' };
                if (avg <= 5.5) return { grade: 'A', color: 'text-red-400' };
                if (avg <= 7.0) return { grade: 'B', color: 'text-purple-400' };
                if (avg <= 9.0) return { grade: 'C', color: 'text-blue-400' };
                return { grade: 'D', color: 'text-gray-500' };
            };

            const renderCoopStatsCard = (isGameOver = false) => (
                <div className="bg-white border-4 border-pink-300 rounded-3xl p-6 shadow-2xl flex flex-col items-center w-full max-w-[340px]">
                    <h2 className={`text-3xl font-black mb-1 ${isGameOver ? 'text-red-500' : 'text-pink-500'}`}>
                        {isGameOver ? 'WAKTU HABIS!' : `LEVEL ${level} CLEAR!`}
                    </h2>
                    <p className="text-sm text-gray-400 font-bold mb-4 tracking-widest uppercase">Laporan Co-op</p>
                    <div className={`text-7xl font-black mb-6 ${getRating().color}`}>{getRating().grade}</div>
                    <div className="w-full space-y-2 mb-6">
                        {[
                            { label: 'Pemain MVP', val: getMVP(), color: 'text-purple-600' },
                            { label: 'Rata-rata Waktu', val: `${getAvgTime()} Detik`, color: 'text-blue-500' },
                            { label: `${playerName} (Kamu)`, val: `${coopSummary.myConnects} Pasang`, color: 'text-teal-500' },
                            { label: `${opponentName} (Partner)`, val: `${coopSummary.allyConnects} Pasang`, color: 'text-red-400' },
                        ].map((row, i) => (
                            <div key={i} className="flex justify-between bg-pink-50/80 p-2.5 rounded-xl font-bold text-sm"
                                style={{ animation: `slideInUp 0.3s ease-out ${i * 0.08}s both` }}>
                                <span className="text-gray-500">{row.label}</span>
                                <span className={row.color}>{row.val}</span>
                            </div>
                        ))}
                    </div>
                    {isGameOver ? (
                        <button onClick={() => { cleanupChannels(); setMultiMode('SINGLE'); setGameState('LOBBY_MAIN'); }} className="cute-btn-text w-full py-3 text-lg font-bold bg-gradient-to-r from-red-400 to-pink-500">Keluar ke Menu</button>
                    ) : isHost ? (
                        <button onClick={() => {
                            const newB = generateBoard();
                            channelRef.current?.publish('action', { type: 'NEXT_LEVEL_SYNC', board: newB, level: level + 1 });
                            prepareLevel(level + 1, newB);
                        }} className="cute-btn-text w-full py-3 text-lg font-bold bg-gradient-to-r from-teal-400 to-emerald-400">Lanjut Level {level + 1}</button>
                    ) : (
                        <div className="flex flex-col items-center">
                            <div className="animate-spin rounded-full h-8 w-8 border-t-4 border-b-4 border-pink-400 mb-2"></div>
                            <p className="text-sm text-gray-500 font-bold">Menunggu Host Lanjut...</p>
                        </div>
                    )}
                </div>
            );

            // Seconds left display
            const secondsLeft = getSecondsLeft(progress, level);

            return (
                <div className="w-full h-[100dvh] bg-pink-100 flex items-center justify-center p-1 sm:p-2">
                    <div className="w-full max-w-[480px] h-full flex flex-col bg-white border-[3px] border-pink-300 rounded-xl shadow-lg overflow-hidden relative">
                        
                        {/* ===================== HEADER ===================== */}
                        <div className="w-full bg-pink-50 p-2 sm:p-3 flex flex-col gap-1 sm:gap-2 shrink-0 border-b-[2px] border-pink-200 z-50 relative">
                            {multiMode !== 'SINGLE' && (
                                <div className="w-full bg-white/80 rounded-full px-3 py-1 flex justify-between items-center text-xs font-bold shadow-sm border border-pink-100 mb-1">
                                    <span className="text-purple-600 truncate max-w-[50%]">
                                        {multiMode === 'COOP' ? `Partner: ${opponentName}` : `${playerName} vs ${opponentName}`}
                                    </span>
                                    {multiMode === 'VERSUS' && (
                                        <span className="text-red-500 bg-red-50 px-2 py-0.5 rounded-full border border-red-100">Lawan: {opponentScore}</span>
                                    )}
                                </div>
                            )}
                            <div className="flex items-center justify-between gap-1 sm:gap-2">
                                <div className="flex items-center bg-white rounded-full px-2 py-0.5 sm:py-1 shadow-sm border border-pink-200">
                                    <IconHeart /><span className="ml-1 text-xs sm:text-sm font-bold text-pink-500">{hp}</span>
                                </div>
                                <div className="text-lg sm:text-xl font-bold text-pink-500 flex items-center gap-1">Level {level}</div>
                                {/* Timer bar with seconds label */}
                                <div className="flex items-center gap-1">
                                    <span className="text-[10px] font-bold text-gray-400 w-6 text-right">{secondsLeft}s</span>
                                    <div className="w-[80px] sm:w-[100px] bg-white rounded-full h-3 sm:h-4 p-[2px] shadow-inner border border-pink-200 relative overflow-hidden">
                                        <div className="h-full rounded-full transition-all duration-200 ease-linear"
                                            style={{ width: `${progress}%`, backgroundImage: progress > 50 ? 'linear-gradient(to right, #a78bfa, #f472b6)' : progress > 25 ? 'linear-gradient(to right, #fde047, #f59e0b)' : 'linear-gradient(to right, #fca5a5, #ef4444)' }}
                                        />
                                    </div>
                                    {/* Timer add float text */}
                                    {showTimerAdd && (
                                        <span className="absolute right-[85px] top-[28px] text-[10px] font-black text-emerald-500 float-text z-[60]">+waktu</span>
                                    )}
                                </div>
                            </div>
                            <div className="flex justify-between items-center mt-0.5">
                                <div className="text-xs sm:text-sm font-bold bg-white px-3 py-1 sm:px-4 sm:py-1.5 rounded-full text-pink-500 border border-pink-200 tracking-wide shadow-sm">
                                    Skor: {score}
                                </div>
                                <div className="flex gap-1.5 sm:gap-2 items-center">
                                    <button onClick={handleHintClick} className="cute-button w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center relative shadow-sm"><IconSearch /><span className="absolute -top-1 -right-1 bg-pink-500 text-white text-[9px] sm:text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{hints}</span></button>
                                    <button onClick={handleShuffleClick} className="cute-button w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center relative shadow-sm"><IconRefresh /><span className="absolute -top-1 -right-1 bg-purple-500 text-white text-[9px] sm:text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">{shuffles}</span></button>
                                    {multiMode === 'SINGLE' && (
                                        <button onClick={() => setGameState('PAUSED')} className="cute-button w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center text-pink-500 shadow-sm"><IconPause /></button>
                                    )}
                                    <button onClick={() => setIsMuted(m => !m)} className="mute-btn w-8 h-8 sm:w-9 sm:h-9 text-pink-400">
                                        <IconMute muted={isMuted} />
                                    </button>
                                </div>
                            </div>
                            {/* Timer hint subtitle */}
                            <p className="text-[9px] text-center text-gray-300 font-bold -mt-0.5">+waktu tiap connect Pokémon</p>
                        </div>

                        {/* ===================== GRID BODY ===================== */}
                        <div className="flex-1 w-full relative bg-white p-0">
                            {board.length > 0 && (
                                <>
                                    <svg viewBox={`0 0 ${COLS + 2} ${ROWS + 2}`} preserveAspectRatio="none" className="absolute inset-0 w-full h-full pointer-events-none" style={{ zIndex: 10 }}>
                                        {activePath && (
                                            <g>
                                                <path d={`M ${activePath.map(p => `${p.c + 0.5} ${p.r + 0.5}`).join(' L ')}`} fill="none" stroke="#f472b6" strokeWidth="0.18" strokeLinecap="round" strokeLinejoin="round" className="path-line-outer drop-shadow-sm"/>
                                                <path d={`M ${activePath.map(p => `${p.c + 0.5} ${p.r + 0.5}`).join(' L ')}`} fill="none" stroke="#ffffff" strokeWidth="0.07" strokeLinecap="round" strokeLinejoin="round" className="path-line-inner"/>
                                            </g>
                                        )}
                                    </svg>

                                    {/* Grid: only render inner COLS x ROWS (no border cells in DOM) */}
                                    <div className="absolute inset-0 grid" style={{ zIndex: 20, gridTemplateColumns: `repeat(${COLS + 2}, 1fr)`, gridTemplateRows: `repeat(${ROWS + 2}, 1fr)`, gap: '0px' }}>
                                        {board.map((row, r) => row.map((cellId, c) => {
                                            // Border cells: invisible spacer for connect-line routing
                                            if (r === 0 || r === ROWS + 1 || c === 0 || c === COLS + 1) {
                                                return <div key={`${r}-${c}`} className="w-full h-full pointer-events-none" />;
                                            }

                                            const isSelected = selectedTile && selectedTile.r === r && selectedTile.c === c;
                                            const matchingTile = matchedTiles.find(m => m.r === r && m.c === c);
                                            const isMatching = !!matchingTile;
                                            const isHinting = hintActiveTiles.find(h => h.r === r && h.c === c);
                                            const isWrong = wrongTile && wrongTile.r === r && wrongTile.c === c;
                                            const isEmpty = cellId === 0 && !isMatching;

                                            return (
                                                <div key={`${r}-${c}`} className="relative w-full h-full" style={{ padding: '1px' }}>
                                                    {!isEmpty && (
                                                        <button 
                                                            className={`cute-tile ${isSelected ? 'selected' : ''} ${isMatching ? 'matched' : ''} ${isHinting ? 'hint-glow' : ''} ${isWrong ? 'wrong' : ''}`}
                                                            style={{ WebkitTapHighlightColor: 'transparent' }}
                                                            onClick={() => handleTileClick(r, c)}
                                                        >
                                                            <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${isMatching ? matchingTile.id : cellId}.png`} alt="pokemon" className="w-full h-full object-contain pointer-events-none" style={{ padding: '1px' }}/>
                                                        </button>
                                                    )}
                                                </div>
                                            );
                                        }))}
                                    </div>
                                </>
                            )}
                        </div>

                        {/* Connection status */}
                        {connectionStatus === 'disconnected' && (
                            <div className="absolute top-0 left-0 right-0 bg-red-400 text-white text-center text-xs font-bold py-1 z-[200]">
                                ! Koneksi terputus, mencoba sambung ulang...
                            </div>
                        )}

                        {/* Board clear flash */}
                        {showBoardClear && (
                            <div className="absolute inset-0 bg-white board-clear-flash z-[90] pointer-events-none" />
                        )}

                        {/* Timeout flash */}
                        {showTimeoutFlash && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-[95] timeout-flash pointer-events-none" style={{ background: 'rgba(239,68,68,0.85)' }}>
                                <span className="text-white text-3xl font-black drop-shadow-lg">Waktu Habis!</span>
                                <span className="text-white text-lg font-bold mt-2">-1 HP</span>
                            </div>
                        )}

                        {/* ===================== OVERLAYS ===================== */}
                        
                        {gameState === 'LOGIN' && (
                            <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100]">
                                <h1 className="text-4xl font-black text-pink-500 mb-2 drop-shadow-sm text-center">POKÉMON<br/>CONNECT</h1>
                                <p className="text-gray-500 font-bold mb-6">Siapa namamu?</p>
                                <input 
                                    type="text" placeholder="Masukkan Nama" maxLength={12}
                                    className="border-4 border-pink-200 rounded-xl px-4 py-3 text-center text-xl font-bold text-gray-700 w-3/4 max-w-[250px] focus:outline-none focus:border-pink-400 transition-colors"
                                    value={playerName} onChange={e => { setPlayerName(e.target.value); setLoginError(''); }}
                                    onKeyDown={e => e.key === 'Enter' && handleLogin()}
                                />
                                {loginError && <p className="text-red-400 text-sm font-bold mt-2">{loginError}</p>}
                                <div className="mb-6" />
                                <button onClick={handleLogin} className="cute-btn-text w-3/4 max-w-[250px] py-3 text-lg font-bold">Mulai!</button>
                            </div>
                        )}

                        {gameState === 'LOBBY_MAIN' && (
                            <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100]">
                                <h1 className="text-4xl font-black text-pink-500 mb-1 drop-shadow-sm text-center">POKÉMON<br/>CONNECT</h1>
                                <h2 className="text-lg font-bold text-purple-400 mb-2">Halo, {playerName}!</h2>
                                {(() => { const best = parseInt(localStorage.getItem('pkmnBestScore') || '0'); return best > 0 ? <p className="text-sm text-pink-300 font-bold mb-6">Best Score: {best}</p> : <div className="mb-6"></div>; })()}
                                <div className="flex flex-col gap-4 w-3/4 max-w-[250px]">
                                    <button onClick={() => prepareLevel(1)} className="cute-btn-text py-3 text-lg font-bold">Main Sendiri</button>
                                    <button onClick={() => startMatchmaking('COOP')} className="cute-btn-text py-3 text-lg font-bold bg-gradient-to-r from-teal-400 to-emerald-400">Mode Co-op</button>
                                    <button onClick={() => startMatchmaking('VERSUS')} className="cute-btn-text py-3 text-lg font-bold bg-gradient-to-r from-red-400 to-pink-500">Mode Versus</button>
                                    <button onClick={() => { localStorage.removeItem('pkmnPlayerName'); setPlayerName(''); setGameState('LOGIN'); }} className="text-gray-400 font-bold underline mt-4">Ganti Nama</button>
                                </div>
                            </div>
                        )}

                        {gameState === 'MATCHMAKING' && (
                            <MatchmakingScreen
                                multiMode={multiMode}
                                playerName={playerName}
                                onCancel={cancelMatchmaking}
                                onRetry={() => startMatchmaking(multiMode)}
                            />
                        )}

                        {gameState === 'LOADING_BOARD' && (
                            <div className="absolute inset-0 bg-white/95 backdrop-blur-md flex flex-col items-center justify-center z-[100]">
                                <div className="animate-bounce mb-6">
                                    <div className="w-16 h-16 bg-white border-4 border-pink-500 rounded-full flex items-center justify-center overflow-hidden relative shadow-lg">
                                        <div className="w-full h-1/2 bg-pink-500 absolute top-0"></div>
                                        <div className="w-5 h-5 bg-white border-4 border-pink-500 rounded-full z-10"></div>
                                    </div>
                                </div>
                                <h2 className="text-2xl font-black text-pink-500 mb-6">Memuat Pokémon...</h2>
                                <div className="w-3/4 max-w-[250px] bg-pink-100 rounded-full h-5 p-1 shadow-inner border border-pink-200">
                                    <div className="h-full rounded-full bg-gradient-to-r from-pink-400 to-purple-400 transition-all duration-300" style={{ width: `${progress}%` }}></div>
                                </div>
                                <p className="text-purple-400 font-bold mt-3 text-lg">{progress}%</p>
                            </div>
                        )}

                        {gameState === 'WAITING_BOTH_LOADED' && (
                            <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100]">
                                <div className="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-teal-400 mb-6"></div>
                                <h2 className="text-2xl font-black text-teal-500 mb-2">Menunggu Pemain Lain...</h2>
                                <p className="text-gray-500 font-bold text-center px-6">Pokémon sudah siap! Menunggu partner selesai loading...</p>
                            </div>
                        )}

                        {gameState === 'COUNTDOWN' && (
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center z-[100]">
                                <div
                                    key={countdown}
                                    style={{
                                        animation: 'countdownPop 0.5s ease-out forwards',
                                        fontSize: countdown === 'GO!' ? '5rem' : '8rem',
                                        color: countdown === 'GO!' ? '#4ade80' : countdown === 1 ? '#f87171' : countdown === 2 ? '#fbbf24' : '#a78bfa',
                                        fontFamily: "'Quicksand', sans-serif",
                                        fontWeight: 900,
                                        lineHeight: 1,
                                        textShadow: '0 0 40px currentColor, 0 4px 0 rgba(0,0,0,0.4)',
                                        display: 'inline-block',
                                    }}
                                >
                                    {countdown}
                                </div>
                            </div>
                        )}

                        {gameState === 'PAUSED' && (
                            <div className="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-[100]">
                                <h2 className="text-3xl font-black text-purple-500 mb-6">DIJEDA</h2>
                                <button onClick={() => setGameState('PLAYING')} className="cute-btn-text px-8 py-3 text-lg font-bold mb-4">LANJUTKAN</button>
                                <button onClick={() => { cleanupChannels(); setMultiMode('SINGLE'); setGameState('LOBBY_MAIN'); }} className="text-gray-400 font-bold underline">Keluar ke Menu</button>
                            </div>
                        )}

                        {/* GAMEOVER */}
                        {gameState === 'GAMEOVER' && (
                            <div className="absolute inset-0 bg-pink-50/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100] p-4">
                                {multiMode === 'COOP' ? renderCoopStatsCard(true) : (
                                    <>
                                        {multiMode === 'VERSUS' ? (() => {
                                            const iWin = score > opponentScore;
                                            const isDraw = score === opponentScore;
                                            return (
                                                <>
                                                    <div className={`text-5xl font-black mb-1 ${iWin ? 'text-green-400' : isDraw ? 'text-yellow-400' : 'text-red-400'}`}>
                                                        {iWin ? 'MENANG!' : isDraw ? 'SERI!' : 'KALAH!'}
                                                    </div>
                                                    <p className="text-sm text-gray-400 font-bold mb-4">Waktu Habis!</p>
                                                    <div className="w-full max-w-[260px] bg-white border-2 border-pink-200 rounded-2xl p-4 mb-4 space-y-2">
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-bold text-gray-600">{playerName} (Kamu)</span>
                                                            <span className={`text-2xl font-black ${iWin ? 'text-green-400' : 'text-pink-400'}`}>{score}</span>
                                                        </div>
                                                        <div className="border-t border-pink-100"></div>
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-bold text-gray-600">{opponentName}</span>
                                                            <span className={`text-2xl font-black ${!iWin && !isDraw ? 'text-green-400' : 'text-red-400'}`}>{opponentScore}</span>
                                                        </div>
                                                    </div>
                                                    <button onClick={handleRematch} className="cute-btn-text bg-gradient-to-r from-purple-400 to-pink-500 px-8 py-3 text-lg font-bold mb-3">
                                                        {isHost ? 'Main Lagi' : 'Kembali ke Menu'}
                                                    </button>
                                                    <button onClick={() => { cleanupChannels(); setMultiMode('SINGLE'); setGameState('LOBBY_MAIN'); }} className="text-gray-400 font-bold underline text-sm">Keluar ke Menu</button>
                                                </>
                                            );
                                        })() : (
                                            <>
                                                <h2 className="text-3xl font-black text-red-400 mb-2">WAKTU HABIS!</h2>
                                                {/* Single player stats */}
                                                <div className="w-full max-w-[280px] bg-white border-2 border-pink-200 rounded-2xl p-4 mb-4 space-y-2">
                                                    {[
                                                        { label: 'Skor Akhir', val: score, big: true },
                                                        { label: 'Level Tertinggi', val: level },
                                                        { label: 'Hint Dipakai', val: 3 - hints },
                                                        { label: 'Shuffle Dipakai', val: 3 - shuffles },
                                                    ].map((row, i) => (
                                                        <div key={i} className="flex justify-between bg-pink-50 p-2.5 rounded-xl font-bold text-sm"
                                                            style={{ animation: `slideInUp 0.3s ease-out ${i * 0.07}s both` }}>
                                                            <span className="text-gray-500">{row.label}</span>
                                                            <span className={`${row.big ? 'text-pink-500 text-xl' : 'text-purple-500'}`}>{row.val}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                {isNewRecord && (
                                                    <div className="record-pop bg-yellow-400 text-white font-black px-4 py-2 rounded-full mb-3 text-lg shadow-lg">
                                                        REKOR BARU!
                                                    </div>
                                                )}
                                                {(() => { const best = parseInt(localStorage.getItem('pkmnBestScore') || '0'); return best > 0 && !isNewRecord && <p className="text-sm text-purple-400 font-bold mb-3">Best: {best}</p>; })()}
                                                <button onClick={() => { cleanupChannels(); setMultiMode('SINGLE'); setGameState('LOBBY_MAIN'); }} className="cute-btn-text bg-gradient-to-r from-red-400 to-pink-500 px-8 py-3 text-lg font-bold">Kembali ke Menu</button>
                                            </>
                                        )}
                                        {connectionStatus === 'opponent_left' && (
                                            <p className="text-xs text-orange-400 font-bold mt-3">! Lawan telah keluar dari permainan</p>
                                        )}
                                    </>
                                )}
                            </div>
                        )}

                        {/* WON */}
                        {gameState === 'WON' && (
                            <div className="absolute inset-0 bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center z-[100] p-4">
                                {multiMode === 'COOP' ? renderCoopStatsCard(false) : (
                                    <>
                                        <h2 className="text-3xl font-black text-green-400 mb-2">LEVEL {level} SELESAI!</h2>
                                        <p className="text-lg text-gray-500 mb-4 font-bold">Lanjut level {level + 1}...</p>
                                        <div className="animate-spin rounded-full h-10 w-10 border-t-4 border-b-4 border-pink-400 mt-4"></div>
                                    </>
                                )}
                            </div>
                        )}
                        
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
